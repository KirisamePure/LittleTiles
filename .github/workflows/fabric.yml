name: Fabric 1.21.10

on:
  push:
    branches: [port/fabric-1.21.10]
    paths: [fabric/**, gradle/wrapper/**, gradlew, .github/workflows/fabric.yml]
  pull_request:
    paths: [fabric/**, gradle/wrapper/**, gradlew, .github/workflows/fabric.yml]

permissions:
  contents: read

jobs:
  fabric:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: fabric
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build and run server integration tests
        run: ../gradlew --no-daemon --max-workers=2 build runGameTest
      - name: Run client rendering and menu smoke test
        env:
          LIBGL_ALWAYS_SOFTWARE: '1'
        run: xvfb-run -a ../gradlew --no-daemon --max-workers=2 runClientGameTest
      - name: Upload development artifact and test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: littletiles-fabric-development
          path: |
            fabric/build/libs/*.jar
            fabric/build/run/clientGameTest/screenshots/
            fabric/build/run/clientGameTest/logs/
            fabric/build/run/gameTest/logs/
          if-no-files-found: warn
